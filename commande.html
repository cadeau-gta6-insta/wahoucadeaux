<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Commande reçue · Wahou Cadeaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120822;--surface:#1d0f33;--ink:#fbf7ff;--muted:#b9a7d1;--line:#33204f;--pink:#ff2e88;--yellow:#ffd23d;--grad:linear-gradient(100deg,#ff2e88 0%,#8a2bc4 55%,#22d3ee 100%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Barlow,system-ui,sans-serif}
.ticker{background:var(--grad);color:#fff;font:400 15px/1 Anton,Impact,sans-serif;letter-spacing:.06em;display:flex;gap:12px;align-items:center;padding:9px 16px;white-space:nowrap;overflow:hidden}
.ticker b{background:#1a0b2e;color:var(--yellow);padding:5px 8px;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px}
.ok{display:inline-flex;align-items:center;gap:8px;background:#1f3b2a;color:#7dffb0;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px}
h1{font:400 clamp(34px,10vw,52px)/1.02 Anton,Impact,sans-serif;text-transform:uppercase;margin:14px 0 6px}
h1 span{color:var(--pink)}
p.lead{margin:0 0 18px;color:var(--muted);font-weight:600}
.card{background:#fff;border-radius:18px;padding:18px 16px 6px;box-shadow:0 0 0 3px #fff,0 0 0 7px var(--pink)}
iframe{width:100%;border:0;min-height:620px;display:block}
.foot{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="ticker"><b>PARODIE</b><span>FLASH INFO</span><span>· WAHOU INFO</span></div>
<main class="wrap">
  <span class="ok">✓ Paiement reçu</span>
  <h1>Dernière étape :<br><span>sa photo</span></h1>
  <p class="lead">30 secondes et c'est parti. Ta vidéo arrive par mail en moins de 24 h.</p>
  <div class="card">
    <iframe id="tally" title="Envoyer la photo" loading="eager"></iframe>
  </div>
  <p class="foot">Un souci ? <a href="mailto:contact@wahoucadeaux.fr">contact@wahoucadeaux.fr</a></p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var s=q.get('session')||'';
  var src='https://tally.so/embed/ArBrRW?alignLeft=1&hideTitle=1&dynamicHeight=1&session='+encodeURIComponent(s);
  var f=document.getElementById('tally');
  f.src=src;
  window.addEventListener('message',function(e){
    if(e.origin!=='https://tally.so')return;
    try{var d=typeof e.data==='string'?JSON.parse(e.data):e.data;
      if(d&&d.event==='Tally.FormPageView'&&d.payload&&d.payload.height){}
      if(d&&d.event==='Tally.Resize'&&d.payload&&d.payload.height){f.style.height=d.payload.height+'px';}
      if(d&&d.event==='Tally.FormSubmitted'){document.querySelector('h1').innerHTML='C\'est noté !<br><span>Surveille tes mails</span>';document.querySelector('.lead').textContent='Ta vidéo arrive en moins de 24 h (pense à vérifier tes spams).';}
    }catch(err){}
  });
})();
</script>
</body>
</html>
