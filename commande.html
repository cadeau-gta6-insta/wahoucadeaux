<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dernière étape · Wahou Cadeaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--soft:#f5f3f8;--ink:#17112a;--muted:#5d5670;--line:#e6e1ee;--pink:#e8186f;--green:#127a46;--green-soft:#e3f6ec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Archivo,system-ui,sans-serif}
a{color:inherit}
header{border-bottom:1px solid var(--line)}
header .in{max-width:620px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:900;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.logo span{color:var(--pink)}
.wrap{max-width:620px;margin:0 auto;padding:22px 16px 40px}
.ok{display:inline-flex;align-items:center;gap:8px;background:var(--green-soft);color:var(--green);font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px}
h1{font-weight:900;font-size:clamp(32px,8.5vw,46px);line-height:1.05;letter-spacing:-.03em;margin:14px 0 6px}
h1 em{font-style:normal;color:var(--pink)}
p.lead{margin:0 0 18px;color:var(--muted);font-weight:600}
.card{border:1px solid var(--line);border-radius:18px;padding:18px 16px 6px;background:var(--bg)}
iframe{width:100%;border:0;min-height:620px;display:block}
.foot{margin-top:24px;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<header><div class="in"><a class="logo" href="/">Wahou<span>.</span> Cadeaux</a></div></header>
<main class="wrap">
  <span class="ok">✓ Paiement reçu, merci !</span>
  <h1>Dernière étape : <em>sa photo</em></h1>
  <p class="lead">30 secondes et c'est parti. Ta vidéo arrive par mail en moins de 24 h.</p>
  <div class="card">
    <iframe id="tally" title="Envoyer la photo" loading="eager"></iframe>
  </div>
  <p class="foot">Un souci ? Écris-nous sur Instagram <a href="https://www.instagram.com/wahoucadeaux/">@wahoucadeaux</a></p>
</main>
<script>
(function(){
  var s=new URLSearchParams(location.search).get('session')||'';
  var f=document.getElementById('tally');
  f.src='https://tally.so/embed/ArBrRW?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1&session='+encodeURIComponent(s);
  window.addEventListener('message',function(e){
    if(e.origin!=='https://tally.so')return;
    try{var d=typeof e.data==='string'?JSON.parse(e.data):e.data;
      if(d&&d.event==='Tally.Resize'&&d.payload&&d.payload.height){f.style.height=d.payload.height+'px';}
      if(d&&d.event==='Tally.FormSubmitted'){document.querySelector('h1').innerHTML="C'est noté ! <em>Surveille tes mails</em>";document.querySelector('.lead').textContent='Ta vidéo arrive en moins de 24 h (pense à vérifier tes spams).';}
    }catch(err){}
  });
})();
</script>
</body>
</html>
